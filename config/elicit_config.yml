default: &default
  participant_frontend:
    host: localhost
    port: 5504
    scheme: http
  elicit_portal:
    host: localhost
    port: 3000
    scheme: http

development:
  <<: *default

test:
  <<: *default

prod_env: &prod_env
  participant_frontend:
    host: experiment-elicit.<%= ENV['SITE_SUFFIX'] %>
    port:  <% ENV['API_SCHEME'] == 'https' ? 443 : 80 %>
    scheme: <% ENV['API_SCHEME'] %>
  elicit_portal:
    host: elicit.<%= ENV['SITE_SUFFIX'] %>
    port: <%= ENV['API_SCHEME'] == 'https' ? 443 : 80 %>
    scheme: <%= ENV['API_SCHEME'] %>

local_env: &local_env
  participant_frontend:
    host: experiment-elicit.<%= ENV['SITE_SUFFIX'] %>
    port: <%= ENV['API_SCHEME'] == 'https' ? 443 : 80 %>
    scheme: <%= ENV['API_SCHEME'] %>
  elicit_portal:
    host: elicit.<%= ENV['SITE_SUFFIX'] %>
    port: <%= ENV['API_SCHEME'] == 'https' ? 443 : 80 %>
    scheme: <%= ENV['API_SCHEME'] %>

demo_env: &demo_env
  participant_frontend:
    host: <%= ENV.fetch('ELICIT_DEMO_HOST', 'localhost') %>
    port: <%= Integer(ENV.fetch('ELICIT_DEMO_EXPERIMENT_PORT', '5505')) %>
    scheme: http
  elicit_portal:
    host: <%= ENV.fetch('ELICIT_DEMO_HOST', 'localhost') %>
    port: <%= Integer(ENV.fetch('ELICIT_DEMO_PORT', '8080')) %>
    scheme: http

production:
  <<: *<%= ENV['ELICIT_DEMO'] == 'true' ? 'demo_env' : ((ENV.fetch('SITE_SUFFIX') { 'docker.local' }) == 'compute.dtu.dk' ? 'prod_env' : 'local_env') %>
