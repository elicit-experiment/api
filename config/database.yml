<%
url_adapters = %w[DATABASE_URL PRIMARY_DATABASE_URL QUEUE_DATABASE_URL].filter_map do |key|
  scheme = ENV[key]&.split(':', 2)&.first
  next if scheme.nil? || scheme.empty?
  { 'postgres' => 'postgresql', 'postgresql' => 'postgresql', 'sqlite3' => 'sqlite3' }.fetch(scheme) do
    raise "Unsupported database URL adapter: #{scheme}"
  end
end
adapter = ENV.fetch('DATABASE_ADAPTER', url_adapters.first || 'postgresql')
raise 'Database URLs must match DATABASE_ADAPTER for both primary and queue' unless url_adapters.all? { |value| value == adapter }
raise "Unsupported DATABASE_ADAPTER: #{adapter}" unless %w[postgresql sqlite3].include?(adapter)
sqlite_directory = ENV.fetch('SQLITE_DATABASE_DIR', 'storage')
%>
<% if adapter == 'sqlite3' %>
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  timeout: 5000

test:
  primary:
    <<: *default
    database: <%= File.join(sqlite_directory, 'test.sqlite3') %>
    schema_dump: sqlite_schema.rb
  queue:
    <<: *default
    database: <%= File.join(sqlite_directory, 'test_queue.sqlite3') %>
    migrations_paths: db/queue_migrate
    schema_dump: sqlite_queue_schema.rb

development:
  primary:
    <<: *default
    database: <%= File.join(sqlite_directory, 'development.sqlite3') %>
    schema_dump: sqlite_schema.rb
  queue:
    <<: *default
    database: <%= File.join(sqlite_directory, 'development_queue.sqlite3') %>
    migrations_paths: db/queue_migrate
    schema_dump: sqlite_queue_schema.rb

production:
  primary:
    <<: *default
    database: <%= File.join(sqlite_directory, 'production.sqlite3') %>
    schema_dump: sqlite_schema.rb
  queue:
    <<: *default
    database: <%= File.join(sqlite_directory, 'production_queue.sqlite3') %>
    migrations_paths: db/queue_migrate
    schema_dump: sqlite_queue_schema.rb
<% else %>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  username: <%= ENV['POSTGRES_USER'] %>
  password: <%= ENV['POSTGRES_PASSWORD'] %>
  host: <%= ENV.fetch('POSTGRES_HOST', '0.0.0.0') %>
  port: <%= ENV.fetch('POSTGRES_PORT', '5433') %>

test:
  primary:
    <<: *default
    database: elicit_test
  queue:
    <<: *default
    database: app_test_queue
    migrations_paths: db/queue_migrate

development:
  primary:
    <<: *default
    database: elicit_development
  queue:
    <<: *default
    database: app_development_queue
    migrations_paths: db/queue_migrate

production:
  primary:
    <<: *default
    database: <%= ENV['POSTGRES_DB'] %>
    schema_search_path: public
  queue:
    <<: *default
    database: app_production_queue
    migrations_paths: db/queue_migrate
    schema_search_path: public
<% end %>
